    <script>
        // 字体完全加载和重复渲染的增强机制
        async function ensureFontRendering() {
            // 第1次：等待字体基础加载
            if (window.FontManager && window.FontManager.waitForLoad) {
                await window.FontManager.waitForLoad();
            }
            
            // 第2次：强制字体渲染测试
            if (window.FontManager && window.FontManager.forceRender) {
                await window.FontManager.forceRender();
            }
            
            // 第3次：延迟重绘
            await new Promise(resolve => setTimeout(resolve, 200));
            
            // 第4次：额外的字体渲染测试
            if (window.FontManager && window.FontManager.forceRender) {
                await window.FontManager.forceRender();
            }
            
            // 第5次：最终延迟重绘
            await new Promise(resolve => setTimeout(resolve, 150));
        }

        window.addEventListener('DOMContentLoaded', async () => {
            // 初始化UI管理器
            if (window.UIManager && window.UIManager.initialize) {
                await window.UIManager.initialize();
            }
            
            // 执行多次字体渲染确保完全加载
            await ensureFontRendering();
            
            // 最终更新预览
            if (window.Renderer && window.Renderer.updatePreview) {
                await window.Renderer.updatePreview();
            }
            
            // 额外的延迟重绘以确保稳定
            setTimeout(async () => {
                if (window.Renderer && window.Renderer.updatePreview) {
                    await window.Renderer.updatePreview();
                }
            }, 300);
        });
    </script>
